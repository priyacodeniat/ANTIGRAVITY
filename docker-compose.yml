services:
  # AgriAssist Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agriassist-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MAX_IMAGE_SIZE_MB=8
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=60
    networks:
      - agriassist-network

  # AgriAssist Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agriassist-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - agriassist-network

networks:
  agriassist-network:
    driver: bridge
